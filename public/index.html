<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#101815" />
		<title>YouTube | Ultraviolet</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: "Trebuchet MS", "Segoe UI", sans-serif;
				background: #101815;
				color: #f3f5ef;
			}
			* { box-sizing: border-box; }
			body {
				min-height: 100vh;
				margin: 0;
				background: linear-gradient(135deg, #101815 0%, #14231f 58%, #30261d 100%);
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 22px clamp(20px, 6vw, 76px);
				border-bottom: 1px solid #ffffff1a;
			}
			.mark {
				width: 34px;
				height: 24px;
				border-radius: 7px;
				background: #ef463a;
				position: relative;
			}
			.mark::after {
				position: absolute;
				top: 7px;
				left: 13px;
				content: "";
				border-top: 5px solid transparent;
				border-bottom: 5px solid transparent;
				border-left: 8px solid white;
			}
			.brand { font-size: 15px; font-weight: 700; }
			main {
				width: min(680px, calc(100% - 40px));
				margin: clamp(72px, 16vh, 150px) auto 64px;
				animation: rise-in 500ms ease-out both;
			}
			.eyebrow {
				margin: 0 0 16px;
				color: #b7c8b9;
				font-size: 12px;
				font-weight: 700;
				text-transform: uppercase;
			}
			h1 {
				max-width: 620px;
				margin: 0;
				font-size: clamp(44px, 8vw, 76px);
				line-height: 0.98;
				font-weight: 700;
				letter-spacing: 0;
			}
			form {
				display: flex;
				gap: 10px;
				margin-top: 38px;
				padding: 8px;
				border: 1px solid #ffffff28;
				border-radius: 10px;
				background: #0c1210;
				box-shadow: 0 18px 50px #0004;
			}
			input {
				min-width: 0;
				flex: 1;
				padding: 13px 12px;
				border: 0;
				outline: 0;
				background: transparent;
				color: inherit;
				font: inherit;
			}
			button {
				min-height: 46px;
				padding: 0 20px;
				border: 0;
				border-radius: 6px;
				background: #ef463a;
				color: white;
				font: inherit;
				font-weight: 700;
				cursor: pointer;
			}
			button:hover { background: #ff5a4d; }
			button:focus-visible, input:focus-visible { outline: 2px solid #9bd5a9; outline-offset: 3px; }
			#message {
				min-height: 24px;
				margin: 12px 4px 0;
				color: #ffc2b9;
				font-size: 14px;
			}
			@keyframes rise-in {
				from { opacity: 0; transform: translateY(12px); }
				to { opacity: 1; transform: translateY(0); }
			}
			@media (max-width: 520px) {
				form { flex-direction: column; }
				button { width: 100%; }
			}
			@media (prefers-reduced-motion: reduce) {
				main { animation: none; }
			}
		</style>
		<script src="/uv.bundle.js"></script>
		<script src="/uv.config.js"></script>
	</head>
	<body>
		<header>
			<span class="mark" aria-hidden="true"></span>
			<span class="brand">YouTube</span>
		</header>
		<main>
			<p class="eyebrow">Ultraviolet</p>
			<h1>Watch on YouTube.</h1>
			<form id="youtube-form">
				<input id="youtube-url" type="text" inputmode="url" placeholder="youtube.com" aria-label="YouTube URL" autocomplete="url" required />
				<button type="submit">Open YouTube</button>
			</form>
			<p id="message" role="status" aria-live="polite"></p>
		</main>
		<script src="/uv.app.js" defer></script>
	</body>
</html>
